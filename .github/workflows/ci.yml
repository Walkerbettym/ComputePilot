name: CI
on: [push, pull_request]
jobs:
  docker-test:
    runs-on: ubuntu-latest
    name: Docker executor integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3

      - name: Install project
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Docker executor tests
        run: pytest tests/integration/test_docker_executor.py -v --tb=short --no-cov
        timeout-minutes: 10

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install build system
        run: pip install hatchling

      - name: Install project + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check + format check)
        run: |
          ruff check computepilot/ tests/ scripts/
          ruff format --check computepilot/ tests/ scripts/

      - name: Type check (mypy --strict)
        run: mypy --strict computepilot/

      - name: Dependency direction check (runtime → agent)
        run: python scripts/check_deps.py

      - name: Unit + Integration tests
        run: >
          pytest tests/unit/ tests/integration/
          --cov=computepilot --cov-report=term-missing
          --cov-fail-under=80
        timeout-minutes: 5

      - name: E2E demo tests
        run: pytest tests/e2e/ -v --tb=short
        timeout-minutes: 5