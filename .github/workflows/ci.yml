name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install hatchling pydantic typer rich pyyaml httpx
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio pytest-cov ruff mypy
      - run: ruff check sciflow/ tests/ scripts/
      - run: mypy --strict sciflow/
      - run: python scripts/check_deps.py
      - run: >
          pytest tests/unit/ tests/integration/ tests/e2e/
          --cov=sciflow --cov-report=term-missing
          --cov-fail-under=60