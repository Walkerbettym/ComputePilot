[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computepilot"
version = "1.1.0"
description = "Agentic workflow runtime for reproducible scientific computing"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ComputePilot Contributors" }]
keywords = ["workflow", "hpc", "scientific-computing", "reproducibility", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
[tool.hatch.build.targets.wheel]
packages = ["computepilot"]

[project.scripts]
cpilot = "computepilot.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance benchmarks (slow)"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]